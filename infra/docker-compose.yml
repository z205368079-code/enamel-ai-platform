name: enamel-ai-platform

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enamel_ai}
      POSTGRES_USER: ${POSTGRES_USER:-enamel_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_for_local_dev}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    build:
      context: ..
      dockerfile: apps/gateway/Dockerfile
    command: ['node', 'apps/gateway/dist/cli/migrate.js']
    restart: 'no'
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://enamel_ai:change_me_for_local_dev@postgres:5432/enamel_ai}
      MIGRATIONS_DIR: /app/infra/postgres/migrations
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build:
      context: ..
      dockerfile: apps/gateway/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      GATEWAY_PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://enamel_ai:change_me_for_local_dev@postgres:5432/enamel_ai}
      CHATWOOT_BASE_URL: ${CHATWOOT_BASE_URL:-}
      CHATWOOT_ACCOUNT_ID: ${CHATWOOT_ACCOUNT_ID:-}
      CHATWOOT_API_TOKEN: ${CHATWOOT_API_TOKEN:-}
      CHATWOOT_REQUEST_TIMEOUT_MS: ${CHATWOOT_REQUEST_TIMEOUT_MS:-5000}
      MAXKB_BASE_URL: ${MAXKB_BASE_URL:-}
      MAXKB_API_KEY: ${MAXKB_API_KEY:-}
      MAXKB_APP_ID: ${MAXKB_APP_ID:-}
      MAXKB_CHAT_COMPLETIONS_URL: ${MAXKB_CHAT_COMPLETIONS_URL:-}
      MAXKB_TIMEOUT_MS: ${MAXKB_TIMEOUT_MS:-10000}
      MAXKB_MAX_RETRIES: ${MAXKB_MAX_RETRIES:-1}
      MAXKB_RETRY_DELAY_MS: ${MAXKB_RETRY_DELAY_MS:-200}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - '${GATEWAY_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
